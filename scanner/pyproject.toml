[project]
name = "closet-scanner"
version = "0.1.0"
description = "갤러리 사진에서 옷을 찾아 옷장을 자동으로 만드는 스캐너 (Closet AI M0)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pillow-heif>=0.18",
    "ai-edge-litert>=1.2",
]

[project.optional-dependencies]
claude = ["anthropic>=0.80"]
dev = ["pytest>=8"]

[project.scripts]
closet-scan = "closet_scanner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["closet_scanner"]
